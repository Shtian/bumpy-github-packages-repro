name: Bumpy Check

# On every PR, report which packages have pending bump files and comment on the PR.
on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx @varlock/bumpy ci check
        env:
          GH_TOKEN: ${{ github.token }}
